site_name: catchpen
site_description: KVM sandboxes for coding agents
site_url: https://blackshieldpt.github.io/catchpen/
repo_url: https://github.com/blackshieldpt/catchpen
repo_name: blackshieldpt/catchpen
edit_uri: edit/master/docs/
copyright: Licensed under AGPL-3.0

theme:
  name: material
  logo: assets/catchpen-icon.svg
  favicon: assets/catchpen-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Getting started:
      - Installation: installation.md
      - CLI reference: cli-reference.md
  - Using catchpen:
      - Templates: templates.md
      - Configuration: configuration.md
      - Agents and credentials: agents.md
      - Forges, repos and SSH: forges.md
      - GitHub tutorial: github.md
      - Sessions, recordings and audit: sessions.md
      - herdr: herdr.md
      - Headless tasks: tasks.md
      - Notifications: notifications.md
      - Snapshots, reset and base updates: snapshots.md
  - Security:
      - Security model: security-model.md
      - Egress: egress.md
      - Package caches: package-caches.md
      - Canaries: canaries.md
  - Operating catchpen:
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
  - Contributing:
      - Development: development.md

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
