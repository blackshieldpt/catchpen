opencode-keys: { description: opencode with provider keys, agents: { opencode: { keys: [ANTHROPIC_API_KEY, OPENROUTER_API_KEY] } }, runtimes: { node: "24" } }
# Claude Code without its default skills: -t -claude,claude-vanilla. Or replace the
# built-in claude section with your own, keeping the name.
# A skill from your own repo, for every agent the VM has:
team-review: { description: "Our review checklist", skills: [{ git: "https://github.com/acme/agent-skills", ref: "0123456789abcdef0123456789abcdef01234567", path: review }] }
# Blackshield's improve skill, for every agent the VM has:
improve: { description: "Blackshield's improve skill: a codebase survey that writes implementation plans", skills: [{ git: "https://github.com/blackshieldpt/improve", ref: "8ce88fedef6ab3f661b3a127b5b8c6e7b43fd4e6", path: skills/improve }] }
