## An example template: the built-in default template's settings, ready to edit.
## Use it with curral up <vm> --template example, or copy it to <name>.yaml.
## Commented lines are options default doesn't set; uncomment what you need.
## A user template shadows a built-in of the same name. Unknown keys are errors.
## Reference: https://blackshieldpt.github.io/curral/templates/

description: The default template's settings, to edit
extends: base                     # one parent: base, minimal, default or a user template
# distro: debian-13               # ubuntu-24.04, ubuntu-26.04, debian-13 or a name from config.yaml images:
resources: { cpus: 4, memory: 8G, disk: 40G }

## Software, baked into the template's base.
packages: [build-essential, make, python3, python3-venv, pkg-config]   # apt packages, optionally name=version
docker: true
tools: [gh]                       # gh, tea
runtimes:
  node: "24"
  python: uv
#   go: "1.27"
# scripts: [scripts/setup.sh]     # run as root at base build; paths are relative to this directory
# files:
#   - { src: files/gitconfig, dst: ~/.gitconfig, mode: "0644" }

## Guest ports bound to 127.0.0.1: "guest" (free host port) or "host:guest".
# ports: [8080, "9000:9000"]

## Agents: claude, opencode, pi, omp, codex. Fields: version, auth, keys, yolo.
agents:
  claude: { auth: oauth-token }   # oauth-token (claude setup-token) | api-key
  opencode: {}                    # provider keys: { keys: [ANTHROPIC_API_KEY, OPENROUTER_API_KEY] }
  pi: {}                          # provider keys: { keys: [ANTHROPIC_API_KEY] }
  codex: { auth: none }           # installed only; to use it: api-key (OPENAI_API_KEY) | chatgpt (codex login --device-auth in the VM)
#   omp: { version: latest, keys: [OPENROUTER_API_KEY] }

## Egress: allowlist (from base), open or none; on_deny: log or prompt.
network:
  presets: [github, npm, pypi, go, apt-ubuntu, apt-debian, docker-apt, docker-hub, ghcr]
#   allow: [registry.example.com:443]
#   on_deny: log
#   prompt_timeout: 30s
#   allow_private: false

## Environment for every ssh session: literal values or secret:NAME.
# env: { GH_TOKEN: "secret:GH_TOKEN", TZ: Europe/Lisbon }

## MCP servers for all agents: stdio (command), http or sse (url).
# mcp:
#   - { name: docs, type: http, url: "https://mcp.example.com/mcp", headers: { Authorization: "secret:DOCS_AUTH" } }
#   - { name: fs, type: stdio, command: [npx, -y, "@modelcontextprotocol/server-filesystem", /workspace] }

# sync:
#   git_identity: true            # host git user.name and user.email
#   claude_config: false          # host ~/.claude settings, CLAUDE.md, agents, skills, commands

## SSH agent for the guest: off, restricted (only agent_keys) or host.
# ssh:
#   agent: restricted
#   agent_keys: [~/.ssh/id_ed25519]
#   confirm: true                 # ask (ssh-askpass) on every use; needs a display

## Repos cloned into /workspace/<repo> at start: forge:owner/repo or a forge URL.
# repos: [github:acme/api]

# idle_stop: 2h                   # off, daily, weekly or a duration >= 1m; overrides config.yaml
cache: [apt, go, npm, pypi, docker]   # host pull-through caches (docker: with docker: true); [] turns them off
canaries: [aws, env, git]             # decoy credentials; their use pauses the VM; [] turns them off
