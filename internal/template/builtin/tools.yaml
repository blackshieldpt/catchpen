default: [base, build, gh]
base:
  description: Tools every VM gets (remove at your own risk)
  packages: [ca-certificates, curl, git, jq, tmux, ripgrep, unzip, less, file, htop, netcat-openbsd]
build:
  description: Compilers and build tools
  packages: [build-essential, make, python3, python3-venv, pkg-config]
gh: { description: GitHub CLI, tools: [gh] }
tea: { description: Gitea CLI, tools: [tea] }
